name: checks

on:
  pull_request:
  push:
    branches: [main]

# Runtime: Node.js 22 (LTS, maintained through April 2027). There is no custom
# container image. GitHub's hosted ubuntu-latest runner is the base image, and
# actions/setup-node installs Node 22 on it. package.json engines matches this.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
